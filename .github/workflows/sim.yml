name: Simulator batches
on:
  push:
    paths:
      - "simjobs/*.job"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache: false
      - name: Run changed jobs
        env:
          BEFORE: ${{ github.event.before }}
          SHARD: ${{ matrix.shard }}
          PROJ1_KEY: ${{ secrets.PROJ1_KEY }}
        run: |
          set -u
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- simjobs 2>/dev/null | grep '\.job$' || true)
          if [ -z "$files" ]; then files=$(git diff --name-only HEAD~1 HEAD -- simjobs | grep '\.job$' || true); fi
          mkdir -p out
          if [ -n "${PROJ1_KEY:-}" ]; then
            mkdir -p ~/.ssh && printf '%s\n' "$PROJ1_KEY" | tr -d '\r' > ~/.ssh/proj1 && chmod 600 ~/.ssh/proj1
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            GIT_SSH_COMMAND="ssh -i ~/.ssh/proj1 -o IdentitiesOnly=yes" git clone -q git@github.com:shaunkar1/proj1.git /tmp/proj1 \
              || { echo "key checkout failed, trying the public address"; rm -rf /tmp/proj1; git clone -q https://github.com/shaunkar1/proj1 /tmp/proj1; }
          else
            git clone -q https://github.com/shaunkar1/proj1 /tmp/proj1
          fi
          for f in $files; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .job)
            commit=$(grep '^commit=' "$f" | cut -d= -f2-)
            n=$(grep '^n=' "$f" | cut -d= -f2-)
            cand=$(grep '^cand=' "$f" | cut -d= -f2-)
            seed=$(grep '^seed=' "$f" | cut -d= -f2-)
            mode=$(grep '^mode=' "$f" | cut -d= -f2-); mode=${mode:-ffa}
            extra=$(grep '^extra=' "$f" | cut -d= -f2- || true)
            ( cd /tmp/proj1 && git checkout -q "$commit" && go build -o /tmp/simbin-$name ./cmd/sim )
            s=$(( ${seed:-1} + SHARD * n ))
            echo "job $name shard $SHARD seed $s n $n"
            ( cd /tmp/proj1 && /tmp/simbin-$name -n "$n" -mode "$mode" -j 4 -seed "$s" -hello sim/hello.jsonl.gz -cand "$cand" $extra ) > "out/$name.shard$SHARD.txt" 2>&1 || echo "FAILED rc=$?" >> "out/$name.shard$SHARD.txt"
            tail -3 "out/$name.shard$SHARD.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: out/
          if-no-files-found: ignore
  collect:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Publish results
        run: |
          mkdir -p simresults
          for f in art/*/*.txt; do
            [ -f "$f" ] || continue
            b=$(basename "$f"); name=${b%%.shard*}
            mkdir -p "simresults/$name"
            grep -E " score |cubes@60|FAILED|elapsed|laser " "$f" > "simresults/$name/$b" || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simresults
          if ! git diff --cached --quiet; then
            git commit -m "sim results"
            for i in 1 2 3 4 5; do git pull --rebase -q && git push && break || sleep 5; done
          fi
